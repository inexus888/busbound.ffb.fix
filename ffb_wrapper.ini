; Bus Bound FFB wrapper settings. Edit, save, then restart the game.
; Log file: ffb_wrapper_log.txt in this folder (overwritten each launch)
[ffb]
; 1 = write the log
log=1
; 1 = log every UpdateEffect call (the game sends ~50 per second per effect)
log_updates=0
; >0 = every N ms, ask the driver whether each effect is still playing
status_poll_ms=1000

; ---- Fixes ----
; 1 = when the driver reports an effect stopped, start it again
auto_restart=1
; 1 = skip the game's SetGain calls when the value hasn't changed (it sends ~50/s)
dedupe_gain=1
; >0 = destroy and recreate the running effects every N ms, like pressing ESC
;      does (try 5000 if you still get dropouts while driving)
rebuild_ms=0
; THE ~35 s DROPOUT FIX. SDL sends "endless" effects to DirectInput as
; 4294966296 us; the Simagic driver keeps 16 bits of milliseconds, so they end
; after ~35.1 s. Restart each effect after restart_min_ms, at a moment when
; the steering force is below restart_low_level (10%), or at restart_max_ms.
restart_min_ms=20000
restart_max_ms=28000
restart_low_level=3277
; Alternative fix to test: send this length (ms) instead of "endless".
; 65535 may mean "infinite" on the Simagic. 0 = off.
length_override_ms=0
; Centring spring. The game's own spring is effectively off (strength 0), so
; the wheel goes limp at stops and feels dead around centre.
; 0 = game default (off). Try 2000 (light) .. 4000 (medium) .. 8000 (heavy). Max 32767.
spring_coeff=4000
; Max force the spring may apply, 0..65535 (65535 = no extra cap)
spring_saturation=65535
; Minimum friction, so the wheel isn't completely free when the bus is stopped.
; The game drops its friction to ~0 when stopped (it only adds friction under
; braking). Below this floor the wrapper raises it; above it the game's value wins.
; 0 = off. Try 1500 (light) .. 3000 (medium) .. 6000 (heavy). Max 32767.
friction_min=0
; Scale the game's own friction, in percent (100 = unchanged, 50 = half as heavy)
friction_scale=100
; 1 = make every effect last forever instead of the length the game asks for
force_infinite_length=0
; 1 = start every effect with infinite repeats
force_infinite_iterations=0
; >0 = restart running effects this often (milliseconds), e.g. 5000
keepalive_ms=0

; ---- Pretend to be another wheel (0 = off) ----
; Wheels matching spoof_from_vid (and spoof_from_pid, if set) are reported to
; the game as spoof_to_vid:spoof_to_pid. Real IDs are written to the log.
spoof_from_vid=0
spoof_from_pid=0
spoof_to_vid=0
spoof_to_pid=0
